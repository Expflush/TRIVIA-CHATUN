<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trivia Parque Chatún</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8f1e2; --card:#fffdf6; --ink:#16301f; --muted:#587060;
  --left:#2f7d6d; --right:#c9792b; --good:#2e8b4a; --bad:#b8402f;
  --line:#c5d6bf;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10201a; --card:#1b3026; --ink:#eaf3e4; --muted:#9db8a5;
    --left:#4fb3a0; --right:#e0974a; --good:#5cc47a; --bad:#e8715f;
    --line:#2d4a3b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10201a; --card:#1b3026; --ink:#eaf3e4; --muted:#9db8a5;
  --left:#4fb3a0; --right:#e0974a; --good:#5cc47a; --bad:#e8715f;
  --line:#2d4a3b;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-user-select:none;user-select:none;
}
header{padding:14px 20px 6px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{height:56px;width:auto;max-width:100px;object-fit:contain}
.logo-big{width:min(220px,60%);height:auto;margin-bottom:6px}
header h1{margin:0;font-size:1.3rem;font-weight:800;letter-spacing:.2px}
header span{font-size:.9rem;color:var(--muted);white-space:nowrap}
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:12px 20px}
.card{
  width:100%;max-width:360px;background:var(--card);border:2px solid var(--line);
  border-radius:28px;padding:32px 26px 30px;text-align:center;
  touch-action:pan-y;cursor:grab;position:relative;
  box-shadow:0 14px 30px rgba(16,40,28,.16);
  transition:transform .25s ease, opacity .25s ease;
}
.card.drag{transition:none;cursor:grabbing}
.card h2{margin:0 0 18px;font-size:1.7rem;line-height:1.2;font-weight:800}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.card .count{margin:0 0 12px;font-size:.85rem;font-weight:700}
.hint{display:flex;justify-content:space-between;margin-top:26px;font-weight:700;font-size:1.4rem}
.hint span{opacity:.35;transition:opacity .15s}
.hint .l{color:var(--left)} .hint .r{color:var(--right)}
.card.toL .hint .l,.card.toR .hint .r{opacity:1}
.card.toL{border-color:var(--left)} .card.toR{border-color:var(--right)}
.options{display:flex;gap:12px;padding:6px 20px 22px}
.opt{
  flex:1;border:0;border-radius:20px;padding:16px 10px;color:#fff;
  font:inherit;font-weight:700;font-size:1rem;line-height:1.2;cursor:pointer;
  min-height:76px;transition:transform .15s, outline-color .15s;
  outline:3px solid transparent;outline-offset:3px;
}
.opt:focus-visible{outline-color:var(--ink)}
.opt.l{background:#1f6657} .opt.r{background:#a65f17}
.opt small{display:block;font-weight:500;opacity:.85;margin-bottom:4px;font-size:.8rem}
.opt.hot{transform:scale(1.04)}
.toast{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:10;
  padding:10px 18px;border-radius:999px;font-weight:700;font-size:.95rem;color:#fff;
  text-align:center;max-width:calc(100% - 40px);
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.toast.show{opacity:1}
.toast.ok{background:#2e7d46} .toast.no{background:#a8382a}
.result{
  position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;background:var(--bg);gap:10px;
}
.result.show{display:flex}
.result .icon{font-size:3rem;line-height:1}
.result h3{margin:0;font-size:2rem;font-weight:800;color:var(--good)}
.result p{margin:0;max-width:300px;color:var(--muted);font-size:1.05rem}
.again{
  margin-top:14px;border:0;border-radius:18px;padding:14px 28px;background:var(--ink);color:var(--bg);
  font:inherit;font-weight:700;font-size:1rem;cursor:pointer;
}
.again:focus-visible{outline:3px solid var(--left);outline-offset:3px}
@media (prefers-reduced-motion: reduce){.card,.opt,.toast{transition:none}}
</style>
</head>

    <h1>Trivia</h1>
  </div>
  <span id="score">Aciertos: 0</span>
</header>

<main class="stage">
  <div class="toast" id="toast" role="status"></div>
  <div class="card" id="card" aria-live="polite">
    <p class="count" id="count"></p>
    <h2 id="q"></h2>
    <p>Desliza la tarjeta hacia la respuesta correcta</p>
    <div class="hint"><span class="l">←</span><span class="r">→</span></div>
  </div>
  <div class="result" id="result" role="status">
    <img class="logo-big" id="logoBig" alt="">
    <div class="icon" id="icon"></div>
    <h3 id="rtitle"></h3>
    <p id="rtext"></p>
    <button class="again" id="again">Jugar otra vez</button>
  </div>
</main>

<div class="options">
  <button class="opt l" id="bl"><small>← Izquierda</small><span id="tl"></span></button>
  <button class="opt r" id="br"><small>Derecha →</small><span id="tr"></span></button>
</div>

<script>
(function(){
  // ====== AQUÍ AGREGAS O CAMBIAS PREGUNTAS ======
  // q = pregunta, ok = respuesta correcta, bad = respuesta incorrecta
  var QUESTIONS = [
    { q: "¿Qué tipo de parque es Chatún?",
      ok: "Parque ecológico", bad: "Parque de atracciones" },
    { q: "¿Cuál de estos juegos SÍ está en el parque?",
      ok: "Pared de escalada", bad: "Paracaidismo" },
    { q: "¿Dónde está ubicado el parque?",
      ok: "Esquipulas", bad: "Ipala" },
    { q: "¿Qué puedes encontrar en Parque Chatún?",
      ok: "Senderos y piscinas", bad: "Pistas de motociclismo" },
    { q: "¿Qué animal es nuestra mascota?",
      ok: "El Torogoz Mossi", bad: "El Quetzal Chapi" }
  ];
  // ==============================================

  var card = document.getElementById("card");
  var result = document.getElementById("result");
  var toast = document.getElementById("toast");
  var bl = document.getElementById("bl"), br = document.getElementById("br");
  var score = 0, current = 0, answers = [], locked = false, toastTimer = null;
  var startX = 0, dx = 0, dragging = false, THRESHOLD = 90;

  function setup(){
    var Q = QUESTIONS[current];
    locked = false; dx = 0;
    document.getElementById("count").textContent =
      "Pregunta " + (current + 1) + " de " + QUESTIONS.length;
    document.getElementById("q").textContent = Q.q;
    // La respuesta correcta cae a veces a la izquierda y a veces a la derecha
    answers = Math.random() < 0.5
      ? [{t:Q.ok, ok:true},{t:Q.bad, ok:false}]
      : [{t:Q.bad, ok:false},{t:Q.ok, ok:true}];
    document.getElementById("tl").textContent = answers[0].t;
    document.getElementById("tr").textContent = answers[1].t;
    result.classList.remove("show");
    card.style.transition = "none";
    card.style.transform = "";
    card.style.opacity = 1;
    card.className = "card";
    void card.offsetWidth;
    card.style.transition = "";
    lean();
  }

  function showToast(ok, text){
    clearTimeout(toastTimer);
    toast.className = "toast show " + (ok ? "ok" : "no");
    toast.textContent = text;
    toastTimer = setTimeout(function(){ toast.classList.remove("show"); }, 1600);
  }

  function choose(side){
    if(locked) return;
    locked = true;
    var Q = QUESTIONS[current];
    var pick = answers[side === "L" ? 0 : 1];
    card.className = "card";
    card.style.transform = "translateX(" + (side === "L" ? -120 : 120) + "%) rotate(" + (side === "L" ? -18 : 18) + "deg)";
    card.style.opacity = 0;
    bl.classList.remove("hot"); br.classList.remove("hot");
    if(pick.ok) score++;
    document.getElementById("score").textContent = "Aciertos: " + score;
    showToast(pick.ok, pick.ok ? "¡Correcto!" : "Incorrecto, era “" + Q.ok + "”");
    // Pasa directamente a la siguiente pregunta
    setTimeout(function(){
      if(current < QUESTIONS.length - 1){
        current++;
        setup();
      } else {
        showFinal();
      }
    }, 300);
  }

  function showFinal(){
    var total = QUESTIONS.length;
    var title = score === total ? "¡Perfecto!" : (score >= total / 2 ? "¡Muy bien!" : "¡Sigue practicando!");
    document.getElementById("logoBig").src = document.getElementById("logo").src;
    document.getElementById("icon").textContent = "🏆";
    document.getElementById("rtitle").textContent = title;
    document.getElementById("rtext").textContent = "Acertaste " + score + " de " + total + " preguntas.";
    result.className = "result show";
    document.getElementById("again").focus();
  }

  document.getElementById("again").addEventListener("click", function(){
    score = 0; current = 0;
    document.getElementById("score").textContent = "Aciertos: 0";
    toast.classList.remove("show");
    setup();
  });

  function lean(){
    card.classList.toggle("toL", dx < -30);
    card.classList.toggle("toR", dx > 30);
    bl.classList.toggle("hot", dx < -THRESHOLD);
    br.classList.toggle("hot", dx > THRESHOLD);
  }

  card.addEventListener("pointerdown", function(e){
    if(locked) return;
    dragging = true; startX = e.clientX;
    card.classList.add("drag");
    card.setPointerCapture(e.pointerId);
  });
  card.addEventListener("pointermove", function(e){
    if(!dragging) return;
    dx = e.clientX - startX;
    card.style.transform = "translateX(" + dx + "px) rotate(" + (dx / 18) + "deg)";
    lean();
  });
  function release(){
    if(!dragging) return;
    dragging = false;
    card.classList.remove("drag");
    if(dx < -THRESHOLD) choose("L");
    else if(dx > THRESHOLD) choose("R");
    else { dx = 0; card.style.transform = ""; lean(); }
  }
  card.addEventListener("pointerup", release);
  card.addEventListener("pointercancel", release);

  bl.addEventListener("click", function(){ choose("L"); });
  br.addEventListener("click", function(){ choose("R"); });
  document.addEventListener("keydown", function(e){
    if(e.key === "ArrowLeft") choose("L");
    if(e.key === "ArrowRight") choose("R");
  });

  setup();
})();
</script>
</body>
</html>
